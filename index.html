<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Mini - Stok Gudang</title>
    
    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            color: #333333;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            color: #2c3e50;
        }

        .btn-tambah {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-tambah:hover {
            background-color: #219653;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .badge-aman {
            background-color: #e2f9e1;
            color: #27ae60;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-warning {
            background-color: #fef3d6;
            color: #d48806;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body onload="muatData()">

    <div class="container">
        <div class="header-flex">
            <div>
                <h2>📦 Modul Inventaris Gudang</h2>
                <p style="margin: 5px 0 0 0; color: #666;">Daftar stok barang dengan Database Mini (LocalStorage).</p>
            </div>
            <button class="btn-tambah" onclick="tambahBarang()">+ Tambah Barang</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID Barang</th>
                    <th>Nama Produk</th>
                    <th>Kategori</th>
                    <th>Stok</th>
                    <th>Harga Satuan</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabel-barang">
                <!-- Data akan otomatis dimuat dari database browser di sini -->
            </tbody>
        </table>
    </div>

    <script>
        // Data default awal jika database masih kosong
        let dataBarang = [
            { id: "PRD-001", nama: "Power Drill Makita", kategori: "Tools / Perkakas", stok: 15, harga: "Rp 850.000" },
            { id: "PRD-002", nama: "Mata Bor Besi Set", kategori: "Aksesori", stok: 42, harga: "Rp 75.000" },
            { id: "PRD-003", nama: "Oli Mesin Industri", kategori: "Maintenance", stok: 3, harga: "Rp 250.000" }
        ];

        // Fungsi untuk menampilkan data ke tabel
        function renderTabel() {
            let tbody = document.getElementById("tabel-barang");
            tbody.innerHTML = ""; // Kosongkan tabel dulu

            dataBarang.forEach(item => {
                let statusBadge = (item.stok < 5) 
                    ? '<span class="badge-warning">Menipis</span>' 
                    : '<span class="badge-aman">Aman</span>';

                let barisBaru = document.createElement("tr");
                barisBaru.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.nama}</td>
                    <td>${item.kategori}</td>
                    <td>${item.stok}</td>
                    <td>${item.harga}</td>
                    <td>${statusBadge}</td>
                `;
                tbody.appendChild(barisBaru);
            });
        }

        // Fungsi saat halaman pertama kali dibuka (mengambil data dari localStorage)
        function muatData() {
            let dataSimpanan = localStorage.getItem("erp_stok_barang");
            if (dataSimpanan) {
                dataBarang = JSON.parse(dataSimpanan); // Ambil data dari database browser
            }
            renderTabel();
        }

        // Fungsi untuk menambah barang baru dan menyimpannya permanen
        function tambahBarang() {
            let id = prompt("Masukkan ID Barang (contoh: PRD-004):");
            if (!id) return;

            let nama = prompt("Masukkan Nama Produk:");
            if (!nama) return;

            let kategori = prompt("Masukkan Kategori:") || "Umum";
            let stok = parseInt(prompt("Masukkan Jumlah Stok:")) || 0;
            let harga = prompt("Masukkan Harga Satuan (contoh: Rp 100.000):") || "Rp 0";

            // Masukkan data baru ke dalam array
            dataBarang.push({ id, nama, kategori, stok, harga });

            // Simpan array terbaru ke LocalStorage (Database Browser)
            localStorage.setItem("erp_stok_barang", JSON.stringify(dataBarang));

            // Refresh tampilan tabel
            renderTabel();
            alert("Barang berhasil ditambahkan dan disimpan ke database!");
        }
    </script>

</body>
</html>
